name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 0_development/pdf-to-jpg/package-lock.json

      - name: Install Dependencies
        working-directory: 0_development/pdf-to-jpg
        run: npm ci

      - name: Build
        working-directory: 0_development/pdf-to-jpg
        run: npm run build

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: 0_development/pdf-to-jpg/dist
          branch: gh-pages
